services:
  postgres:
    image: postgres:17
    container_name: eventsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventsync
      POSTGRES_PASSWORD: eventsync_password
      POSTGRES_DB: eventsync
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: